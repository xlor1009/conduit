[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vendor-patch-cli"
version = "1.0.0"
description = "Downstream scanner, codemod, test verifier, and PR generator for vendor signals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.0",
  "libcst>=1.4",
  "pathspec>=0.12",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
dev = ["pytest>=8.0"]

[project.scripts]
vendor-patch = "vendor_patch_cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
