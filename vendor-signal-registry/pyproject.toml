[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vendor-signal-registry"
version = "1.0.0"
description = "Central vendor signal ingestion workers and registry.json publisher"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.22",
  "beautifulsoup4>=4.12",
  "feedparser>=6.0",
  "packaging>=24.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
dev = ["pytest>=8.0"]

[project.scripts]
vendor-signals = "vendor_signal_registry.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vendor_signal_registry = ["py.typed"]
