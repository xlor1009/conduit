name: Build Vendor Signal Registry

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "vendor-signal-registry/**"
      - "schema.json"
      - ".github/workflows/build-registry.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: registry-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install registry package
        run: |
          python -m pip install --upgrade pip
          pip install -e "./vendor-signal-registry"

      - name: Run ingestion pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_MODEL_SNAPSHOT: "1"
        run: python -m vendor_signal_registry.pipeline build

      - name: Validate registry artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from vendor_signal_registry.schema_validate import assert_valid
          path = Path("vendor-signal-registry/dist/registry.json")
          assert_valid(json.loads(path.read_text(encoding="utf-8")))
          print("schema ok:", path)
          PY

      - name: Commit updated registry (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor-signal-registry/dist/registry.json \
                  vendor-signal-registry/docs/registry.json \
                  vendor-signal-registry/data/.models-snapshot.json || true
          if git diff --staged --quiet; then
            echo "No registry changes to commit"
          else
            git commit -m "chore(registry): refresh vendor signal registry"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: vendor-signal-registry/docs

  deploy-pages:
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
