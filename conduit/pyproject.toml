[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conduit"
version = "0.2.0"
description = "Autonomous CLI for breaking API migrations via detect modules and Migration Packets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.0",
  "libcst>=1.4",
  "pathspec>=0.12",
  "jsonschema>=4.22",
  "beautifulsoup4>=4.12",
  "feedparser>=6.0",
  "packaging>=24.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
dev = ["pytest>=8.0"]

[project.scripts]
conduit = "conduit.main:app"

[project.entry-points."conduit.detect_modules"]
openai = "conduit.detect.modules.openai:OpenAIModule"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conduit = ["py.typed"]

[tool.setuptools]
include-package-data = true
